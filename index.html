<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Смотреть</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0B0B0D;
      color: #FFFFFF;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 42px 12px 40px;
    }

    /* Верхний текст */
    .headline {
      text-align: center;
      font-size: 18px;
      line-height: 1.45;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 22px;
    }

    /* Главная кнопка */
    .main-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 240px;
      height: 44px;
      margin: 0 auto 30px;

      background: #FF8A00;
      color: #FFFFFF;
      text-decoration: none;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;

      border-radius: 8px;
    }

    /* Сетка карточек */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 105px);
      gap: 10px;
      justify-content: center;
    }

    /* Карточка */
    .card {
      position: relative;
      display: block;
      width: 105px;
      height: 105px;
      overflow: hidden;
      border-radius: 6px;
      text-decoration: none;
      background: #141416;
    }

    .card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Затемнение снизу */
    .card-title {
      position: absolute;
      left: 0;
      bottom: 0;

      width: 100%;
      height: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.65);

      color: #FF8A00;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    /* Небольшой эффект при нажатии */
    .card:active,
    .main-button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="headline">
      СМОТРИ ВСЕГДА!<br>
      СМОТРИ ВЕЗДЕ!<br>
      СМОТРИ БЕЗ ИНТЕРНЕТА!
    </div>

    <a class="main-button" href="https://porntube.s.gy/hUUoQt">
      СМОТРЕТЬ
    </a>

    <div class="cards">

      <a class="card" href="https://porntube.s.gy/hUUoQt">
        <img src="film.jpg" alt="Анал">
        <div class="card-title">Анал</div>
      </a>

      <a class="card" href="https://porntube.s.gy/hUUoQt">
        <img src="music.jpg" alt="Минет">
        <div class="card-title">Минет</div>
      </a>

      <a class="card" href="https://porntube.s.gy/hUUoQt">
        <img src="serials.jpg" alt="Групповое">
        <div class="card-title">Групповое</div>
      </a>

      <a class="card" href="https://porntube.s.gy/hUUoQt">
        <img src="cartoons.jpg" alt="Спящие">
        <div class="card-title">Спящие</div>
      </a>

      <a class="card" href="https://porntube.s.gy/hUUoQt">
        <img src="sport.jpg" alt="Домашнее">
        <div class="card-title">Домашнее</div>
      </a>

      <a class="card" href="https://porntube.s.gy/hUUoQt">
        <img src="documentary.jpg" alt="Вписка">
        <div class="card-title">Вписка</div>
      </a>

    </div>

  </main>

</body>
</html>
